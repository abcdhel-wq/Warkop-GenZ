<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle: warm coffee brown -->
  <circle cx="32" cy="32" r="32" fill="#2D1E12"/>

  <!-- Saucer -->
  <ellipse cx="32" cy="50" rx="18" ry="4.5" fill="#4A3525"/>
  <ellipse cx="32" cy="50" rx="14" ry="3" fill="#8C6D53"/>

  <!-- Mug body -->
  <rect x="17" y="28" width="26" height="20" rx="5" fill="#F5EFE6"/>
  <!-- Inner coffee liquid -->
  <rect x="19" y="30" width="22" height="16" rx="4" fill="#C07840"/>
  <!-- Foam / crema on top -->
  <rect x="19" y="30" width="22" height="5" rx="3" fill="#F0D9B5"/>
  <!-- Latte art heart -->
  <path d="M27 33 Q30 30 32 33 Q34 30 37 33 Q34 37 32 39 Q30 37 27 33 Z" fill="#B87840" opacity="0.65"/>

  <!-- Mug handle -->
  <path d="M43 33 Q51 33 51 38 Q51 43 43 43" fill="none" stroke="#8C6D53" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Mug top rim -->
  <rect x="17" y="26" width="26" height="4" rx="3" fill="#E8DFD8"/>

  <!-- Steam wisps -->
  <path d="M26 22 Q24 17 26 13" fill="none" stroke="#D5C3B0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M32 20 Q30 15 32 11" fill="none" stroke="#D5C3B0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M38 22 Q36 17 38 13" fill="none" stroke="#D5C3B0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
